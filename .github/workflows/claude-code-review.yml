name: Claude Code Review

# Auto-review every PR. Auth via the CLAUDE_CODE_OAUTH_TOKEN secret created by
# running `/install-github-app` in Claude Code. If that secret is absent the job
# is skipped (so the workflow is harmless until the app is installed).

"on":
  pull_request:
    types: [opened, synchronize]
    # Committed eval fixtures are data, not source. A fixture-only PR has nothing
    # for a code reviewer to say, and a 2.8 MB JSONL diff spent the whole turn
    # budget before reaching any code (#144).
    paths-ignore:
      - "eval/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: "claude-review-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip cleanly until the OAuth token secret exists.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check for Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Claude review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@0cb4f3e5e764d2e00407d29b6bf0aa9df0976d88 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for mailrag (a local-first email RAG system).
            Be concise and high-signal — only flag things that matter. Focus on:
            - Correctness bugs, edge cases, and broken error handling.
            - Test coverage: per the repo's TDD rule, new or changed logic should
              have unit tests (unittest.TestCase style) covering happy path, edge
              cases, and invalid inputs. Flag untested new behaviour.
            - Security: leaked secrets/keys, unsafe deserialization, injection.
            - Clarity and consistency with surrounding code and docstrings.
            - Whether behaviour changes are reflected in docs (docstrings, docs/).

            The PR branch is already checked out. Post findings as GitHub comments
            only — use inline comments for specific lines and one top-level summary
            comment. Do not approve or block; just review.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
