name: Claude

# `@claude` in a comment, review or new issue. Public repo, so the reusable
# workflow in fmasi/.github requires BOTH the @claude mention AND an OWNER,
# MEMBER or COLLABORATOR author: claude-code-action has its own write-access
# check, but it has known bugs (action issues #351/#387), so this is
# defense-in-depth against arbitrary users burning CI/credits by dropping
# "@claude" into an issue. Issues fire on creation only: `assigned` would
# re-fire on old issues for little gain. A skipped run is free.

"on":
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened] }

jobs:
  claude:
    uses: fmasi/.github/.github/workflows/claude-mention.yml@main
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
