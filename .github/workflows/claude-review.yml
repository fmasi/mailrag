name: Claude review

# One Claude review per PR, not one per push: it runs when the PR is marked ready
# (`gh pr ready`) or labelled `ready-for-review`. Re-review after fixes with an
# `@claude review` comment (claude.yml). The rubric lives in
# .github/claude-review-prompt.md, shared with the local `/ci-review`. The gates
# (not a draft, same-repo head, the right action/label) and the per-PR
# concurrency live in the reusable workflow in fmasi/.github.

"on":
  pull_request:
    types: [ready_for_review, labeled]
    # Committed eval fixtures are data, not source. A fixture-only PR has nothing
    # for a code reviewer to say, and a 2.8 MB JSONL diff spent the whole turn
    # budget before reaching any code (#144).
    paths-ignore:
      - "eval/**"

jobs:
  review:
    uses: fmasi/.github/.github/workflows/claude-review.yml@main
    permissions: { contents: read, pull-requests: write, issues: write, id-token: write, actions: read }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      claude-args: |
        --max-turns 30
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
