name: Test Suite

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "test-suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        # --all-extras so the optional NVIDIA connectors are installed and the
        # NimEmbedder / NIM-reranker tests actually RUN (not importorskip) in CI.
        run: poetry install --with dev --all-extras --no-interaction --no-root

      - name: Run full test suite
        run: poetry run python -m pytest tests/ --cov=src --cov-report=term-missing -q