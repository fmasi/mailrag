name: Dependency Review

# Scans dependency-manifest changes (poetry.lock / requirements.txt / pyproject)
# introduced by a PR and fails if any added dependency carries a known
# vulnerability at `moderate` severity or higher. Runs only on pull_request —
# the action diffs the PR base against head and has nothing to compare on push.
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: "dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          # The same no-fix exceptions as pip-audit (ci.yml `pip-audit`, the justfile's
          # `audit_ignores`), each an advisory with NO fixed release; keep the three in step:
          #   GHSA-8mgp-746c-j5xp (PYSEC-2026-3740): nltk <= 3.10.3, the latest release. A
          #     pathsec bypass in model import/export APIs that neither llama-index-core (the
          #     only thing pulling nltk in) nor this repo ever calls.
          allow-ghsas: GHSA-8mgp-746c-j5xp
