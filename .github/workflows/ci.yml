name: CI Quality Gates

# The non-test gates, mirrored command for command by the justfile (`just ci`), which also runs
# test-suite.yml's `pytest`. Two jobs, two checks:
#   - `lint`: ruff lint + format, SAST (ruff S), mypy, workflow lint (actionlint + zizmor) and a
#     gitleaks scan of the new commits. All fast and deps-free, so ONE job (CHEATSHEET R8: every
#     job has a 1-minute billing floor and its own runner start-up).
#   - `pip-audit`: needs the full locked env, and is a REQUIRED check on its own, so a red
#     dependency audit blocks the merge by name.
# Renaming either job renames its check: update the ruleset (protect.sh) in the same change.
"on":
  # Every job skips drafts (`if` below): a draft is the local-work phase
  # (`just ci`), and `gh pr ready` is what runs these gates.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Supersede stale PR runs, but never cancel a push to main: every commit on
  # main gets a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Release binaries pinned by version AND sha256, the same pins as fmasi/.github's
      # just-ci.yml (gitleaks and actionlint: the release's checksums.txt; zizmor ships none, so
      # the asset digest GitHub's release API reports). Bump them together with that file.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history so gitleaks can scan the commit range this event brings.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      # Ruff and mypy are standalone: no project deps. With ignore_missing_imports every
      # third-party import then resolves to Any, so the mypy gate only checks our own source and
      # is deterministic (independent of which library stub versions a resolve pulls). Pinned
      # exactly like pyproject's dev group and the justfile: bump all three together.
      - name: Install ruff and mypy
        run: python -m pip install --upgrade pip "ruff==0.15.20" "mypy==2.1.0"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # SAST: ruff's bandit rules. S101 = asserts; S110/S112 = try/except/pass and /continue
      # (swallowed errors, low severity, left to the Claude review). Per-path exceptions and the
      # reasons for them are in pyproject.toml; inline ones carry a `# noqa: Sxxx - reason`.
      - name: SAST (ruff S)
        run: ruff check --select S --ignore S101,S110,S112 .

      - name: mypy (type check)
        run: mypy src/

      - name: Install gitleaks, actionlint and zizmor
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          g="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$g" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${g}" | sha256sum -c -
          tar -xzf "$g" -C "$bin" gitleaks
          a="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$a" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${a}" | sha256sum -c -
          tar -xzf "$a" -C "$bin" actionlint
          z="$RUNNER_TEMP/zizmor.tar.gz"
          curl -fsSL --retry 3 -o "$z" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${z}" | sha256sum -c -
          tar -xzf "$z" -C "$bin" zizmor
          echo "$bin" >> "$GITHUB_PATH"

      # Scans the commits this event brings (PR: base..head, push: before..after), and the full
      # history when there is no usable range (workflow_dispatch, a new branch, a force-push).
      # Secrets are redacted in the log. Known false positives: .gitleaksignore.
      - name: Scan for secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          base="" head=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" head="$PR_HEAD_SHA" ;;
            push)         base="$PUSH_BEFORE" head="$PUSH_AFTER" ;;
          esac
          args=(git --no-banner --redact --verbose)
          if [ -n "$base" ] && [ -n "$head" ] && [[ ! "$base" =~ ^0+$ ]] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null \
             && git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "Scanning ${base}..${head}"
            args+=(--log-opts="${base}..${head}")
          else
            echo "No usable commit range for '$EVENT_NAME'; scanning the full history."
          fi
          gitleaks "${args[@]}" .

      - name: Lint workflows (actionlint, zizmor)
        env:
          # Read-only token: zizmor's online audits (impostor commits, known-vulnerable actions)
          # query public GitHub data with it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actionlint
          zizmor --min-severity high .github/workflows

  pip-audit:
    # REQUIRED check (the ruleset names it `pip-audit`): a known-vulnerable dependency blocks
    # the merge. Renaming this job renames the check.
    name: pip-audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      # Install the exact locked dependency set (deterministic, matches ship).
      - name: Install dependencies
        run: poetry install --with dev --all-extras --no-interaction --no-root

      # --upgrade pip matters: pip-audit audits every distribution in the venv,
      # including pip itself, and the pip that virtualenv seeds runs a few
      # releases behind — routinely old enough to be carrying an open advisory
      # of its own. pip is the installer, not a project dependency, so the
      # honest fix is to freshen it rather than ignore the advisory. Note the
      # earlier "Install Poetry" step upgrades the *outer* interpreter's pip,
      # which is a different pip from this venv's.
      - name: Install pip-audit
        run: poetry run python -m pip install --upgrade pip pip-audit

      # Audit the resolved environment against the OSV database. Every advisory
      # with a fixed release is cleared by a constraint floor in pyproject.toml
      # (see the "Transitive security floors" block there for the per-package
      # advisory IDs), never waived.
      #
      # --ignore-vuln is ONLY for an advisory with NO fixed release, each with
      # its reason here and the same list in the justfile's `audit_ignores` and
      # in dependency-review.yml's `allow-ghsas` (by GHSA ID).
      # Drop an entry, and raise the floor, as soon as its fix ships:
      #   PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp, CVE-2026-81726), nltk <= 3.10.3,
      #     the latest release. A pathsec sandbox bypass in nltk's model-artifact
      #     import/export APIs (TransitionParser, AveragedPerceptron,
      #     PerceptronTagger.save_to_json, save_maxent_params). nltk is only a
      #     transitive of llama-index-core, which uses its tokenizers and corpora,
      #     never those APIs, and nothing here imports nltk or enables pathsec.
      - name: Run pip-audit
        run: >
          poetry run pip-audit
          --vulnerability-service osv
          --ignore-vuln PYSEC-2026-3740
