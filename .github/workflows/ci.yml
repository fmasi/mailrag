name: CI Quality Gates

# Lint / format / type-check / dependency-audit gates. Kept separate from the
# `pytest` required check (test-suite.yml) so each gate is an independently
# named status that can be wired into branch protection later.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      # Ruff is a standalone binary; no need to install the full project deps.
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.15.20"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      # Run WITHOUT the heavy ML/LLM stack installed: with ignore_missing_imports
      # every third-party import resolves to Any, so the gate only checks our own
      # source and is deterministic (independent of which library stub versions a
      # given resolve happens to pull). Also keeps the job fast. Devs with the
      # full env can still run `poetry run mypy src/` locally.
      - name: Install mypy
        run: python -m pip install --upgrade pip "mypy==2.1.0"

      - name: Run mypy
        run: mypy src/

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      # Install the exact locked dependency set (deterministic, matches ship).
      - name: Install dependencies
        run: poetry install --with dev --all-extras --no-interaction --no-root

      # --upgrade pip matters: pip-audit audits every distribution in the venv,
      # including pip itself, and the pip that virtualenv seeds is often a few
      # releases behind (it currently seeds 26.1.1, which carries PYSEC-2026-196,
      # fixed in 26.1.2). pip is the installer, not a project dependency, so the
      # honest fix is to freshen it rather than ignore the advisory. The earlier
      # "Install Poetry" step upgrades the *outer* interpreter's pip, which is a
      # different pip from this venv's.
      - name: Install pip-audit
        run: poetry run pip install --upgrade pip pip-audit

      # Audit the resolved environment against the OSV database, with NO
      # --ignore-vuln exceptions: every advisory that has reached us now has an
      # upstream fix, pulled in by the constraint floors in pyproject.toml
      # (see the "Transitive security floors" block there for the per-package
      # advisory IDs). The nltk path-traversal ignore that used to live here
      # — GHSA-p4gq-832x-fm9v / PYSEC-2026-597 — is gone: it was only ever a
      # placeholder for "fixed in 3.10.0, but 3.10.0 is not on PyPI yet", and
      # 3.10.x has since shipped.
      #
      # Keep this list empty. If a new advisory lands with no fixed release,
      # prefer pinning around it; add an --ignore-vuln only as a last resort,
      # and say here which upstream release is being waited on.
      - name: Run pip-audit
        run: >
          poetry run pip-audit
          --vulnerability-service osv
