[tool.poetry]
name = "rag-study"
version = "0.1.0"
description = "RAG study project"
authors = ["Frederic Masi"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Depend on llama-index-core + the specific integration packages we import,
# NOT the `llama-index` umbrella meta-package: the umbrella pins the openai
# sub-packages to <0.7, which conflicts with llama-index-llms-openai-like (needs
# >=0.7.0). The code never imports bare `llama_index`, only these sub-packages.
llama-index-core = "^0.14.22"
llama-index-embeddings-openai = "^0.6.0"
llama-index-llms-openai = "^0.7.0"
# Unified OpenAI-compatible LLM for the cleanup client (src/llm/client.py) and
# the lmstudio answer side (Settings.llm): one LLM stack for LM Studio / NIM /
# Ollama / vLLM / OpenAI. See P2 Step-3 unification (#39).
llama-index-llms-openai-like = "^0.7.2"
llama-index-llms-perplexity = "^0.5.1"
llama-index-vector-stores-qdrant = "^0.10.0"
# Default cross-encoder reranker (bge-m3 / A path) used by query/hybrid.py.
# FlagEmbedding is already a main dep; this is the thin LlamaIndex wrapper. It
# was previously pulled only transitively / installed ad-hoc in the rag env.
llama-index-postprocessor-flag-embedding-reranker = "^0.5.0"
# Optional NVIDIA NeMo Retriever connectors for the C/NIM experiment path
# (dense-embedding NIM + reranking NIM). Imported lazily in src/ingest/embedder.py
# and src/query/hybrid.py; install with `poetry install --extras nvidia`.
llama-index-embeddings-nvidia = {version = "^0.5.1", optional = true}
llama-index-postprocessor-nvidia-rerank = {version = "^0.6.0", optional = true}
datasets = "^4.5.0"
huggingface-hub = "^1.4.1"
python-dotenv = "^1.2.1"
pydantic = "^2.12.5"
rich = "^14.0.0"
azure-storage-blob = "^12.28.0"
llama-index-vector-stores-pinecone = "^0.7.1"
qdrant-client = "^1.17.1"
FlagEmbedding = "^1.3.0"
questionary = "^2.1.0"
openai = "^1.0"
anthropic = "^0.40"
tqdm = "^4.66"
numpy = "^2.0"
scikit-learn = "^1.5"
pypdf = "^6.10.2"
python-docx = "^1.1"
openpyxl = "^3.1"
python-pptx = "^1.0"
pytesseract = "^0.3"
pdf2image = "^1.17"
pillow = "^12.2"
# Official Model Context Protocol SDK — powers the stdio MCP server
# (src/mcp_server) that exposes the email-RAG query path to MCP clients.
mcp = "^1.28.1"

[tool.poetry.extras]
# C/NIM experiment path (NVIDIA NeMo Retriever dense embed + rerank NIMs)
nvidia = ["llama-index-embeddings-nvidia", "llama-index-postprocessor-nvidia-rerank"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^6.0"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
	"integration: needs live Qdrant + LLM + bge-m3 (deselected by default)",
]

# --- Ruff: lint + format -----------------------------------------------------
# Conservative, formatter-friendly config. line-length matches the codebase
# (most lines already sit under 100). The formatter reflows code; the linter
# handles imports (I), pyflakes (F), pycodestyle errors/warnings (E/W).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
	# E501 (line too long): the formatter already wraps code; the residual
	# offenders are long string literals / comments / URLs that ruff format
	# deliberately never splits. Enforcing it here would only add noqa noise.
	"E501",
	# E741 (ambiguous var name, e.g. `l`): a handful of short-lived loop
	# variables in product + test code. Renaming them is a behaviour-neutral
	# but noisy churn we skip in this CI-only change; it is purely stylistic.
	"E741",
]

[tool.ruff.lint.per-file-ignores]
# Deliberate late (non-top-of-file) imports to sidestep import cycles / keep a
# module's public helpers defined before the integration imports that use them.
"src/data/loaders/mail_archive_x.py" = ["E402"]
"tests/test_summary_rerank.py" = ["E402"]
# Standalone eval scripts bootstrap sys.path / os.chdir / offline env vars
# BEFORE importing src.*, so their imports intentionally sit below that setup.
"scripts/**" = ["E402"]

# --- mypy: lenient type-check gate -------------------------------------------
# Deliberately NOT strict: this repo was never annotated end-to-end, so the gate
# only checks the annotations that DO exist and never fails on third-party libs
# that ship no stubs (ignore_missing_imports). It is a regression guard, not a
# push toward full typing.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Untyped defs are fine (most of the codebase); we only type-check bodies where
# annotations are present, so partially-typed modules still pass cleanly.
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
files = ["src"]

# Pre-existing type-debt: these modules were written before any typing pass and
# trip mypy on Optional-vs-required args, invariant dicts, and library return
# types. Properly annotating them is a code change out of scope for this
# CI-only PR, so we silence errors per-module (the other ~88 modules stay fully
# checked, so the gate still catches regressions in new/clean code).
[[tool.mypy.overrides]]
module = [
	"src.config.settings",
	"src.data.models",
	"src.data.noise_filter",
	"src.data.loaders.mail_archive_x",
	"src.data.loaders.azure_blob",
	"src.eval.metrics",
	"src.indexing.contextual_index",
	"src.ingest.embedder",
	"src.llm.summary",
	"src.pipeline.prune",
	"src.query.summary_rerank",
	"src.storage.persist",
]
ignore_errors = true
