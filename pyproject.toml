[tool.poetry]
name = "rag-study"
version = "0.1.0"
description = "RAG study project"
authors = ["Frederic Masi"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Depend on llama-index-core + the specific integration packages we import,
# NOT the `llama-index` umbrella meta-package: the umbrella pins the openai
# sub-packages to <0.7, which conflicts with llama-index-llms-openai-like (needs
# >=0.7.0). The code never imports bare `llama_index`, only these sub-packages.
llama-index-core = "^0.14.22"
llama-index-embeddings-openai = "^0.6.0"
llama-index-llms-openai = "^0.7.0"
# Unified OpenAI-compatible LLM for the cleanup client (src/llm/client.py) and
# the lmstudio answer side (Settings.llm): one LLM stack for LM Studio / NIM /
# Ollama / vLLM / OpenAI. See P2 Step-3 unification (#39).
llama-index-llms-openai-like = "^0.7.2"
llama-index-llms-perplexity = "^0.5.1"
llama-index-vector-stores-qdrant = "^0.10.0"
# Default cross-encoder reranker (bge-m3 / A path) used by query/hybrid.py.
# FlagEmbedding is already a main dep; this is the thin LlamaIndex wrapper. It
# was previously pulled only transitively / installed ad-hoc in the rag env.
llama-index-postprocessor-flag-embedding-reranker = "^0.5.0"
# Optional NVIDIA NeMo Retriever connectors for the C/NIM experiment path
# (dense-embedding NIM + reranking NIM). Imported lazily in src/ingest/embedder.py
# and src/query/hybrid.py; install with `poetry install --extras nvidia`.
llama-index-embeddings-nvidia = {version = "^0.5.1", optional = true}
llama-index-postprocessor-nvidia-rerank = {version = "^0.6.0", optional = true}
datasets = "^4.5.0"
huggingface-hub = "^1.4.1"
python-dotenv = "^1.2.1"
pydantic = "^2.12.5"
rich = "^14.0.0"
azure-storage-blob = "^12.28.0"
llama-index-vector-stores-pinecone = "^0.7.1"
# PINNED BELOW 1.19 — do not widen to a caret without re-running the suite.
# qdrant-client 1.19.0 deleted `IDF_EMBEDDING_MODELS` from
# qdrant_client.qdrant_fastembed (it had already been emptied to a zero-length
# collection in 1.18). llama-index-vector-stores-qdrant still imports that name
# at module import time — as of its latest release, 0.10.2 — so a 1.19 client
# makes `from llama_index.vector_stores.qdrant import QdrantVectorStore` raise
# ImportError, which takes down every dense/hybrid/MCP code path we have.
# Upstream declares `qdrant-client>=1.16.0` with no upper bound, so the resolver
# will happily pick 1.19 and break the build; this cap is what stops it.
# Revisit once llama-index-vector-stores-qdrant drops the import — tracked in
# issue #106. Note the band is a single minor version, so a security fix shipped
# as 1.19.x rather than 1.18.x would be unreachable until the cap is lifted;
# #106 carries that as the trigger to act early.
# 1.18.0 also matches the Qdrant server line we run (see docker-compose.yml).
qdrant-client = ">=1.18.0,<1.19"
FlagEmbedding = "^1.3.0"
questionary = "^2.1.0"
# Full-screen TUI framework for the guided wizard (src/tui); questionary stays
# for the `--classic` fallback and the scope verb's line-prompt picker.
textual = "^8.2.8"
openai = "^1.0"
anthropic = "^0.40"
tqdm = "^4.66"
numpy = "^2.0"
scikit-learn = "^1.5"
pypdf = "^6.10.2"
python-docx = "^1.1"
openpyxl = "^3.1"
python-pptx = "^1.0"
# Structure-aware attachment chunking (#89): parse spreadsheets by row-groups
# (header repeated per chunk) so large sheets are split into embedder-sized chunks
# instead of one giant blob bge-m3 truncates at 8192 tokens. Used in
# src/indexing/attachment_chunking.py.
pandas = ">=2.2,<4"
pytesseract = "^0.3"
pdf2image = "^1.17"
# 12.3 is the CVE floor: 12.2 is affected by CVE-2026-54059/54060/55379/55380/55798
# (PYSEC-2026-2253..2257), all fixed in 12.3.0.
pillow = "^12.3"
# Official Model Context Protocol SDK — powers the stdio MCP server
# (src/mcp_server) that exposes the email-RAG query path to MCP clients.
mcp = "^1.28.1"
# Continuous sync (src/sync, issue #101). PyYAML parses accounts.yaml (already a
# transitive dep, declared here because we import it directly). imapclient is the
# IMAP leg: actively maintained, and it exposes ENABLE / CONDSTORE / CHANGEDSINCE,
# which imaplib does not. Optional — a Maildir-only or export-only user needs no
# IMAP client; install with `poetry install --extras imap`.
PyYAML = "^6.0"
imapclient = {version = "^3.1.0", optional = true}
# --- Transitive security floors (not imported directly) ---------------------
# These are pulled in transitively (soupsieve via beautifulsoup4; transformers
# via FlagEmbedding). We pin a minimum here purely to lift the resolved version
# past known CVEs — see the pip-audit job in .github/workflows/ci.yml.
#   soupsieve  — CVE-2026-49476/49477 (PYSEC-2026-3071/3072), fixed in 2.8.4.
#                Supersedes Dependabot PR #79.
soupsieve = "^2.8.4"
#   transformers — CVE-2026-5241 (PYSEC-2026-2290), fixed in 5.5.0.
transformers = "^5.5.0"
#   click — CVE-2026-7246 (PYSEC-2026-2132), fixed in 8.3.3; pin the 8.4 line.
click = "^8.4.1"
#   aiohttp — pulled in by llama-index-core / openai / fsspec.
#             GHSA-mfx4-hv73-q22v + GHSA-mq44-7p77-q5h7 fixed in 3.14.2,
#             GHSA-cq5v-8q36-5273 (high) fixed in 3.14.3.
aiohttp = "^3.14.3"
#   cryptography — via azure-storage-blob. GHSA-g6cj-pr64-35w5 (high) is fixed in
#                  50.0.0, which is a major bump: 50.x drops the deprecated
#                  OpenSSL 1.1.1 backend, an API we never touch (we only consume
#                  it transitively for Azure blob auth).
cryptography = "^50.0.0"
#   nltk — via llama-index-core. Four high advisories (GHSA-6hm5-jgcp-p838,
#          GHSA-fg7f-2386-8897, GHSA-qvv7-cg9c-w4x3, GHSA-xh95-f55m-82fw) plus the
#          path-traversal GHSA-p4gq-832x-fm9v the CI audit used to ignore, all
#          fixed in 3.10.0. That release is now on PyPI (3.10.2), so the
#          --ignore-vuln entries in ci.yml could finally be dropped.
nltk = "^3.10.2"
#   h2 — via httpx[http2] (the qdrant-client transport). GHSA-6hr6-w5qg-qmwg
#        fixed in 4.4.1.
h2 = "^4.4.1"
#   torch — via FlagEmbedding / transformers / sentence-transformers.
#           GHSA-rrmf-rvhw-rf47 is fixed in 2.13.0. This bump is also what
#           unblocks the setuptools floor below: torch <=2.12.1 caps
#           `setuptools <82`, so setuptools could not reach its own fix until
#           torch moved. 2.13.0 relaxes that to `setuptools >=77.0.3`.
#           Supersedes Dependabot PR #100.
torch = "^2.13.0"
#   setuptools — via llama-index-core (and formerly capped by torch, see above).
#                GHSA-h35f-9h28-mq5c fixed in 83.0.0.
setuptools = "^83.0.0"

[tool.poetry.extras]
# C/NIM experiment path (NVIDIA NeMo Retriever dense embed + rerank NIMs)
nvidia = ["llama-index-embeddings-nvidia", "llama-index-postprocessor-nvidia-rerank"]
# IMAP source for `mailrag sync` (src/sync/imap_source.py)
imap = ["imapclient"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^6.0"
ipykernel = "^7.2.0"
# The two CI quality gates, declared so a dev environment built from this file
# is complete — previously they existed only as pinned `pip install` lines in
# .github/workflows/ci.yml, so running them locally meant installing them by
# hand, and whatever version you happened to get. Pinned exactly (not caret) to
# the versions ci.yml uses: a lint/type gate that disagrees with CI about which
# rules exist is worse than no local gate at all. Bump both here and in the
# matching `ruff (lint + format)` / `mypy (type check)` jobs in
# .github/workflows/ci.yml together.
ruff = "0.15.20"
mypy = "2.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
	"integration: needs live Qdrant + LLM + bge-m3 (deselected by default)",
]

# --- Ruff: lint + format -----------------------------------------------------
# Conservative, formatter-friendly config. line-length matches the codebase
# (most lines already sit under 100). The formatter reflows code; the linter
# handles imports (I), pyflakes (F), pycodestyle errors/warnings (E/W).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
	# E501 (line too long): the formatter already wraps code; the residual
	# offenders are long string literals / comments / URLs that ruff format
	# deliberately never splits. Enforcing it here would only add noqa noise.
	"E501",
	# E741 (ambiguous var name, e.g. `l`): a handful of short-lived loop
	# variables in product + test code. Renaming them is a behaviour-neutral
	# but noisy churn we skip in this CI-only change; it is purely stylistic.
	"E741",
]

[tool.ruff.lint.per-file-ignores]
# Deliberate late (non-top-of-file) imports to sidestep import cycles / keep a
# module's public helpers defined before the integration imports that use them.
"src/data/loaders/mail_archive_x.py" = ["E402"]
"tests/test_summary_rerank.py" = ["E402"]
# Standalone eval scripts bootstrap sys.path / os.chdir / offline env vars
# BEFORE importing src.*, so their imports intentionally sit below that setup.
"scripts/**" = ["E402"]

# --- mypy: lenient type-check gate -------------------------------------------
# Deliberately NOT strict: this repo was never annotated end-to-end, so the gate
# only checks the annotations that DO exist and never fails on third-party libs
# that ship no stubs (ignore_missing_imports). It is a regression guard, not a
# push toward full typing.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Untyped defs are fine (most of the codebase); we only type-check bodies where
# annotations are present, so partially-typed modules still pass cleanly.
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
files = ["src"]

# Pre-existing type-debt: these modules were written before any typing pass and
# trip mypy on Optional-vs-required args, invariant dicts, and library return
# types. Properly annotating them is a code change out of scope for this
# CI-only PR, so we silence errors per-module (the other ~88 modules stay fully
# checked, so the gate still catches regressions in new/clean code).
[[tool.mypy.overrides]]
module = [
	"src.config.settings",
	"src.data.models",
	"src.data.noise_filter",
	"src.data.loaders.mail_archive_x",
	"src.data.loaders.azure_blob",
	"src.eval.metrics",
	"src.indexing.contextual_index",
	"src.ingest.embedder",
	"src.llm.summary",
	"src.pipeline.prune",
	"src.query.summary_rerank",
	"src.storage.persist",
]
ignore_errors = true
